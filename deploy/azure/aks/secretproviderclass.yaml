# Lee los secretos de Key Vault con Workload Identity y los sincroniza en el Secret "valkiria-secrets",
# que la API y la app sintética consumen con envFrom. La sincronización ocurre mientras un pod monte el volumen CSI.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: valkiria-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: __WORKLOAD_CLIENT_ID__
    keyvaultName: __KEYVAULT_NAME__
    tenantId: __TENANT_ID__
    objects: |
      array:
        - |
          objectName: synthetic-database-url
          objectType: secret
  secretObjects:
    - secretName: valkiria-secrets
      type: Opaque
      data:
        - objectName: synthetic-database-url
          key: VALKIRIA_SYNTHETIC_DATABASE_URL
