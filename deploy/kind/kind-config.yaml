# Clúster kind de pruebas: publica el NodePort de la API en http://localhost:8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: valkiria
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
