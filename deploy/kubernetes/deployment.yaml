apiVersion: apps/v1
kind: Deployment
metadata: {name: valkiria-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: valkiria-api}}
  template:
    metadata: {labels: {app: valkiria-api}}
    spec:
      containers:
      - name: api
        image: ghcr.io/your-org/valkiria:0.1.0
        ports: [{containerPort: 8000}]
        securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1, memory: 1Gi}}
