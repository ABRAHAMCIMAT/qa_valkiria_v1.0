name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: valkiria
          POSTGRES_PASSWORD: valkiria_synthetic_only
          POSTGRES_DB: nissan_synthetic
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U valkiria -d nissan_synthetic"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      VALKIRIA_MODE: synthetic
      VALKIRIA_ENVIRONMENT: qa
      VALKIRIA_ALLOW_PRODUCTION: "false"
      VALKIRIA_DB_PROFILE: synthetic_postgresql
      VALKIRIA_DB_ENGINE: postgresql
      VALKIRIA_SYNTHETIC_DATABASE_URL: postgresql+psycopg://valkiria:valkiria_synthetic_only@localhost:5432/nissan_synthetic
      VALKIRIA_RELEASE_MODE: preview
      VALKIRIA_DIRECT_COMMIT: "false"
      VALKIRIA_PR_REQUIRED: "true"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - run: pip install -e '.[dev,synthetic]'
    - run: pytest -q
    - run: ruff check src tests
    - run: bandit -q -r src
