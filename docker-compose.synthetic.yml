services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: valkiria
      POSTGRES_PASSWORD: valkiria_synthetic_only
      POSTGRES_DB: nissan_synthetic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valkiria -d nissan_synthetic"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./synthetic_db/migrations:/docker-entrypoint-initdb.d:ro
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    profiles: ["llm"]
