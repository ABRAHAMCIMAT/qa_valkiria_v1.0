name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Ruff y Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Bandit
        run: bandit -q -c pyproject.toml -r src

  test:
    name: Unitarias y E2E sintética
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: valkiria
          POSTGRES_PASSWORD: valkiria_synthetic_only
          POSTGRES_DB: nissan_synthetic
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U valkiria -d nissan_synthetic"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      VALKIRIA_MODE: synthetic
      VALKIRIA_ENVIRONMENT: qa
      VALKIRIA_ALLOW_PRODUCTION: "false"
      VALKIRIA_DB_PROFILE: synthetic_postgresql
      VALKIRIA_DB_ENGINE: postgresql
      VALKIRIA_SYNTHETIC_DATABASE_URL: postgresql+psycopg://valkiria:valkiria_synthetic_only@localhost:5432/nissan_synthetic
      VALKIRIA_RELEASE_MODE: preview
      VALKIRIA_DIRECT_COMMIT: "false"
      VALKIRIA_PR_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev,synthetic]'
      - name: Aplicar migraciones y datos sintéticos
        env:
          PGPASSWORD: valkiria_synthetic_only
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U valkiria -d nissan_synthetic -f synthetic_db/migrations/V1__create_schema.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U valkiria -d nissan_synthetic -f synthetic_db/fixtures/V2__seed_nissan_data.sql
      - name: Pruebas unitarias
        run: pytest -q --ignore=tests/e2e
      - name: E2E sintética contra PostgreSQL
        env:
          RUN_SYNTHETIC_E2E: "1"
        # -rs muestra omisiones; con RUN_SYNTHETIC_E2E=1 la prueba no debe omitirse.
        run: pytest -v -rs tests/e2e

  package:
    name: Wheel y sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install "build>=1.2,<2"
      - name: Construir wheel y source distribution
        run: python -m build
      - name: Verificar que el wheel se instala
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "from valkiria.api.app import create_app; create_app()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Imagen Docker y entorno de desarrollo
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -f deploy/docker/Dockerfile -t valkiria:0.5.0 .
      - name: Verificar usuario no root
        run: test "$(docker run --rm valkiria:0.5.0 id -u)" = "10001"
      - name: Levantar entorno sintético
        run: docker compose -f docker-compose.synthetic.yml up -d --wait
      - name: Probar /health
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8090/health
          curl -fsS -o /dev/null http://localhost:8000/
      - name: Logs si falla
        if: failure()
        run: docker compose -f docker-compose.synthetic.yml logs
      - name: Apagar entorno
        if: always()
        run: docker compose -f docker-compose.synthetic.yml down -v
